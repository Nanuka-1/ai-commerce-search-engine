# 02.11: Alembic — схема базы одной командой. Адрес базы НЕ здесь: берётся из DATABASE_URL (Doppler).
# Команды (из корня проекта):
#   doppler run -- alembic current          какая версия схемы у базы
#   doppler run -- alembic upgrade head     довести базу до последней версии
#   doppler run -- alembic check            совпадают ли models.py и база
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S