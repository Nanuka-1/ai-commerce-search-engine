# Проба ETL: запускается ТОЛЬКО кнопкой (Run workflow), без расписания.
# Цель: проверить, что компьютеры GitHub (США) пускают на topsport.ge
# и что ключи из шкафчика "etl" доходят до скрипта и запись в базу работает.
name: ETL probe

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько ссылок на товары обработать"
        required: true
        default: "20"

permissions:
  contents: read

jobs:
  scrape-probe:
    runs-on: ubuntu-latest
    environment: etl          # открываем шкафчик с ключами из Doppler
    timeout-minutes: 15       # проба короткая; если зависнет — GitHub сам остановит

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      CACHE_BACKEND: ${{ secrets.CACHE_BACKEND }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_ENABLED: ${{ secrets.LLM_ENABLED }}
      LLM_MODELS: ${{ secrets.LLM_MODELS }}
      LLM_TIMEOUT_SECONDS: ${{ secrets.LLM_TIMEOUT_SECONDS }}
      SEMANTIC_SEARCH_ENABLED: ${{ secrets.SEMANTIC_SEARCH_ENABLED }}
      PYTHONUNBUFFERED: "1"   # печать сразу видна в логе, а не в конце

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Can GitHub reach topsport.ge?
        run: |
          curl -sS -o /dev/null -w "sitemap HTTP %{http_code}, %{time_total}s\n" \
            https://topsport.ge/sitemap_ka.xml

      - name: Scrape probe (limit)
        env:
          PROBE_LIMIT: ${{ inputs.limit }}   # через env, а не прямо в команду — так безопаснее
        run: python -c "import os; from ingestion.scrape_category import main; main(limit=int(os.environ['PROBE_LIMIT']))"