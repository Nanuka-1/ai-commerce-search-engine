# CI (был с начала проекта: только тесты). 02.11 добавлено: кэш pip, отмена старых запусков, проверка миграций.
# CI — при каждом push / pull request в master GitHub сам:
#   1) ставит Python 3.13 и библиотеки из requirements.txt (заодно проверка, что в файле ничего не забыто);
#   2) запускает все тесты папки tests/ (как прежний ci.yml) (без секретов: тесты не ходят в Neon и Gemini);
#   3) поднимает ПУСТУЮ Postgres с pgvector и проверяет миграции Alembic с нуля —
#      та же репетиция, что 02.11 вручную на базе migration_check.
# Docker на компьютере не нужен: всё выполняется на серверах GitHub.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:                       # новый push отменяет ещё идущую проверку старого
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

  migrations:
    name: Migrations (Alembic on empty Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17      # Postgres + расширение vector, как в Neon
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci            # временная база внутри GitHub, живёт минуты — не секрет
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upgrade from empty database
        run: alembic upgrade head

      - name: Models and database match
        run: alembic check

      - name: Downgrade to empty and upgrade again
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic current