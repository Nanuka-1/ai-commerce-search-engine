<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TopSport — AI ასისტენტი</title>
<style>
  :root {
    --blue: #134a8e;
    --blue-dark: #0e3870;
    --red: #e3262f;
    --bg: #f3f5f9;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #6b7486;
    --line: #e2e6ee;
    --bot: #ffffff;
    --user: #134a8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Noto Sans Georgian", "BPG Arial", Arial, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: var(--blue); color: #fff; padding: 12px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .logo { font-weight: 800; font-size: 20px; letter-spacing: .5px; }
  .logo span { color: var(--red); }
  .subtitle { opacity: .85; font-size: 14px; flex: 1; }
  .lang { display: flex; gap: 4px; }
  .lang button {
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.5);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font-weight: 600;
  }
  .lang button.active { background: #fff; color: var(--blue); }

  main { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .chat { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; }
  .bubble {
    padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
  }
  .user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bubble a { color: var(--blue); }
  .badge {
    display: inline-block; margin-top: 4px; font-size: 11px; color: var(--muted);
  }
  .badge.ai { color: #7a4cc2; }

  .cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 10px; margin-top: 10px; width: min(860px, 100%);
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .card .img { aspect-ratio: 1 / 1; background: #fafbfc; display: flex; align-items: center; justify-content: center; }
  .card img { width: 100%; height: 100%; object-fit: contain; }
  .card .noimg { color: var(--muted); font-size: 32px; }
  .card .body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .card .brand { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .card .name { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .price { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .price .now { font-weight: 700; color: var(--blue); }
  .price .old { color: var(--muted); text-decoration: line-through; font-size: 12px; }
  .price .off { background: var(--red); color: #fff; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px; }
  .sizes { display: flex; flex-wrap: wrap; gap: 4px; }
  .sizes span { border: 1px solid var(--line); border-radius: 5px; font-size: 11px; padding: 1px 5px; }
  .sizes span.hit { border-color: var(--blue); color: var(--blue); font-weight: 700; }
  .card a.go {
    margin-top: auto; text-align: center; background: var(--blue); color: #fff; text-decoration: none;
    border-radius: 8px; padding: 6px; font-size: 13px; font-weight: 600;
  }
  .card a.go:hover { background: var(--blue-dark); }
  .site-all {
    align-self: flex-start; margin-top: 10px; display: inline-block; color: var(--blue); font-weight: 600; text-decoration: none;
    border: 1px solid var(--blue); border-radius: 8px; padding: 6px 12px; background: #fff;
  }

  .typing { color: var(--muted); font-style: italic; }

  .suggest { max-width: 860px; margin: 0 auto; padding: 0 16px 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .suggest button {
    border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 5px 12px;
    cursor: pointer; font-size: 13px; color: var(--text);
  }
  .suggest button:hover { border-color: var(--blue); color: var(--blue); }
  .suggest a.sale {
    border: 1px solid var(--red); background: var(--red); color: #fff; border-radius: 16px; padding: 5px 12px;
    font-size: 13px; font-weight: 700; text-decoration: none;
  }
  .suggest a.sale:hover { background: #c51f27; }

  form {
    background: #fff; border-top: 1px solid var(--line); padding: 12px 16px;
  }
  .row { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; font-size: 15px; outline: none;
  }
  input[type=text]:focus { border-color: var(--blue); }
  form button {
    background: var(--red); color: #fff; border: 0; border-radius: 10px; padding: 0 18px;
    font-weight: 700; cursor: pointer; font-size: 15px;
  }
  form button:disabled { opacity: .5; cursor: default; }
  .debug { font-size: 11px; color: var(--muted); max-width: 860px; margin: 0 auto 6px; padding: 0 16px; }
</style>
</head>
<body>
<header>
  <div class="logo">TOP<span>SPORT</span></div>
  <div class="subtitle" id="subtitle"></div>
  <div class="lang">
    <button type="button" data-lang="ka">KA</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main id="scroll"><div class="chat" id="chat"></div></main>

<div class="suggest" id="suggest"></div>
<form id="form" autocomplete="off">
  <div class="row">
    <input type="text" id="input" maxlength="300">
    <button type="submit" id="send"></button>
  </div>
</form>

<script>
// Демо-страница чата TopSport (шаг F2). Только показывает ответ сервера:
// что найти и что сказать решают поиск, бизнес-правила и LLM на сервере.
const API_URL = "/chat/message";
// Страница распродажи на сайте (пункт меню «ფასდაკლება» / «Discount») — вставить точный адрес
const SALE_URL = { ka: "https://topsport.ge/ka/products/sale", en: "https://topsport.ge/en/products/sale" };

const UI = {
  ka: {
    subtitle: "AI ასისტენტი",
    placeholder: "მაგ.: სარბენი ფეხსაცმელი 42",
    send: "გაგზავნა",
    hello: "გამარჯობა! რით შემიძლია დაგეხმაროთ? 👋",
    sale: "🔥 აქტუალური ფასდაკლებები",
    typing: "ვეძებ…",
    view: "საიტზე ნახვა",
    all: "ყველა ვარიანტი საიტზე →",
    sizes: "ზომები",
    ai: "✨ AI პასუხი",
    error: "კავშირის შეცდომა. სცადეთ ხელახლა.",
    suggest: ["სარბენი ფეხსაცმელი 42", "ქალის ჯემპრი S", "ზამთრის ქურთუკი M", "ნაიკი 42", "pegasus"],
  },
  en: {
    subtitle: "AI assistant",
    placeholder: "e.g. running shoes 42",
    send: "Send",
    hello: "Hello! How can I help you? 👋",
    sale: "🔥 Current discounts",
    typing: "Searching…",
    view: "View on site",
    all: "All options on the website →",
    sizes: "Sizes",
    ai: "✨ AI answer",
    error: "Connection error. Please try again.",
    suggest: ["running shoes 42", "warm jacket M", "nike 42", "crocs 42", "adidas samba 40"],
  },
};

let lang = "ka";
const chat = document.getElementById("chat");
const scroll = document.getElementById("scroll");
const input = document.getElementById("input");
const send = document.getElementById("send");

function userId() {
  // свой id на браузер, чтобы у каждого демо-пользователя была своя сессия
  try {
    let id = localStorage.getItem("ts_demo_user");
    if (!id) { id = "demo-" + Math.random().toString(36).slice(2, 10); localStorage.setItem("ts_demo_user", id); }
    return id;
  } catch (e) {
    return window.__demoId || (window.__demoId = "demo-" + Math.random().toString(36).slice(2, 10));
  }
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;   // textContent — без HTML-инъекций
  return node;
}

// Текст с кликабельными ссылками (сообщение "не нашли" содержит ссылку на поиск сайта)
function linkified(text) {
  const wrap = el("div", "bubble");
  const parts = String(text || "").split(/(https?:\/\/[^\s]+)/g);
  for (const part of parts) {
    if (/^https?:\/\//.test(part)) {
      const a = el("a", null, part.length > 60 ? part.slice(0, 57) + "…" : part);
      a.href = part; a.target = "_blank"; a.rel = "noopener";
      wrap.appendChild(a);
    } else {
      wrap.appendChild(document.createTextNode(part));
    }
  }
  return wrap;
}

function addUser(text) {
  const msg = el("div", "msg user");
  msg.appendChild(el("div", "bubble", text));
  chat.appendChild(msg);
  toBottom();
}

function formatPrice(value) {
  if (value === null || value === undefined) return null;
  const n = Number(value);
  return (Number.isInteger(n) ? n : n.toFixed(2)) + " ₾";
}

function card(item, askedSize) {
  const c = el("div", "card");
  const imgBox = el("div", "img");
  if (item.image_url) {
    const img = document.createElement("img");
    img.src = item.image_url; img.alt = item.name || ""; img.loading = "lazy";
    img.onerror = () => { imgBox.innerHTML = ""; imgBox.appendChild(el("div", "noimg", "👟")); };
    imgBox.appendChild(img);
  } else {
    imgBox.appendChild(el("div", "noimg", "👟"));
  }
  c.appendChild(imgBox);

  const body = el("div", "body");
  if (item.brand) body.appendChild(el("div", "brand", item.brand));
  body.appendChild(el("div", "name", item.name || ""));

  const price = item.price_from ?? item.price;
  const priceRow = el("div", "price");
  if (price !== undefined && price !== null) priceRow.appendChild(el("span", "now", formatPrice(price)));
  if (item.regular_price && price && item.regular_price > price) {
    priceRow.appendChild(el("span", "old", formatPrice(item.regular_price)));
    priceRow.appendChild(el("span", "off", "-" + Math.round((1 - price / item.regular_price) * 100) + "%"));
  }
  body.appendChild(priceRow);

  const sizes = item.sizes || (item.size ? [item.size] : []);
  if (sizes.length) {
    const box = el("div", "sizes");
    sizes.slice(0, 12).forEach(s => box.appendChild(el("span", String(s) === String(askedSize) ? "hit" : "", s)));
    body.appendChild(box);
  }

  if (item.product_url) {
    const a = el("a", "go", UI[lang].view);
    a.href = item.product_url; a.target = "_blank"; a.rel = "noopener";
    body.appendChild(a);
  }
  c.appendChild(body);
  return c;
}

function addBot(response) {
  const msg = el("div", "msg bot");
  msg.appendChild(linkified(response.message || ""));

  const meta = response.meta || {};
  if (meta.ai_used) msg.appendChild(el("span", "badge ai", UI[lang].ai));

  const results = (response.data && response.data.results) || {};
  const items = results.items || [];
  if (items.length) {
    const askedSize = (results.query || "").match(/\b(\d{2}(?:\.\d)?|XXS|XS|S|M|L|XL|XXL|XXXL)\b/i);
    const grid = el("div", "cards");
    items.forEach(item => grid.appendChild(card(item, askedSize ? askedSize[1].toUpperCase() : null)));
    msg.appendChild(grid);
  }
  if (results.site_search_url) {
    const a = el("a", "site-all", UI[lang].all);
    a.href = results.site_search_url; a.target = "_blank"; a.rel = "noopener";
    msg.appendChild(a);
  }
  chat.appendChild(msg);
  toBottom();
}

function addText(text, cls) {
  const msg = el("div", "msg bot");
  const b = el("div", "bubble" + (cls ? " " + cls : ""), text);
  msg.appendChild(b);
  chat.appendChild(msg);
  toBottom();
  return msg;
}

function toBottom() { scroll.scrollTop = scroll.scrollHeight; }

async function ask(text) {
  text = text.trim();
  if (!text) return;
  addUser(text);
  input.value = "";
  send.disabled = true;
  const typing = addText(UI[lang].typing, "typing");
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId(), message: text, locale: lang, limit: 5, offset: 0 }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    typing.remove();
    addBot(data);
  } catch (e) {
    typing.remove();
    addText(UI[lang].error);
    console.error(e);
  } finally {
    send.disabled = false;
    input.focus();
  }
}

function applyLang(newLang) {
  lang = newLang;
  document.documentElement.lang = lang;
  document.getElementById("subtitle").textContent = UI[lang].subtitle;
  input.placeholder = UI[lang].placeholder;
  send.textContent = UI[lang].send;
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
  const suggest = document.getElementById("suggest");
  suggest.innerHTML = "";
  UI[lang].suggest.forEach(s => {
    const b = el("button", null, s);
    b.type = "button";
    b.onclick = () => ask(s);
    suggest.appendChild(b);
  });
  // последняя "подсказка" — реклама распродажи: ведёт на страницу скидок сайта
  const sale = el("a", "sale", UI[lang].sale);
  sale.href = SALE_URL[lang]; sale.target = "_blank"; sale.rel = "noopener";
  suggest.appendChild(sale);
}

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => applyLang(b.dataset.lang));
document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); ask(input.value); });

applyLang("ka");
addText(UI[lang].hello);
input.focus();
</script>
</body>
</html>
